name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check both bundles
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Rebuild the tab region from its source
        run: node scripts/build-lib.mjs
      - name: Fail if the committed region is stale
        run: git diff --exit-code lib/client.js
      - name: Locale keys and identifiers
        run: node scripts/validate-lib.mjs
      - name: Manifest declares dsh.bundle
        run: node -e "const p=require('./package.json');if(!p.dsh?.bundle?.patch)throw new Error('package.json must declare dsh.bundle.patch');console.log('dsh.bundle.patch =',p.dsh.bundle.patch)"
